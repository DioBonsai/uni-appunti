<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f4f6fb">
<title>Quaderno di ripasso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=JetBrains+Mono:wght@500;600&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Tutto il CSS sta in extra.css: la build lo inserisce qui, prima di questo tag di chiusura. */
</style>
<script>
/* Lingua e tema impostati subito, prima del primo disegno, per evitare lampi di colore. */
(function () {
  document.documentElement.lang = 'it';
  try {
    var t = localStorage.getItem('quaderno-tema');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
